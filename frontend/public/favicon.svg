<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="laserGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="#243145" stroke-width="2"/>
  <!-- Target Reticle Circles -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <!-- Crosshairs -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="14" y2="32" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <!-- Glowing Center Target Dot (FSOC Laser Emission) -->
  <circle cx="32" cy="32" r="8" fill="url(#laserGlow)"/>
  <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
</svg>